map $request_uri $api_backend {
    ~^/api/v1/(chat|pending-actions|memory)(/|$) chat-orchestrator:8005;
    default business-backend:8000;
}

map $http_x_request_id $correlation_id {
    "~^[A-Za-z0-9_.-]{1,128}$" $http_x_request_id;
    default $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $correlation_id always;
        error_page 502 504 = @unavailable;
    }

    error_page 413 = @too_large;
    location @unavailable {
        default_type application/json;
        add_header X-Request-ID $correlation_id always;
        return 503 '{"detail":"Upstream service is unavailable","code":"upstream_unavailable","correlation_id":"$correlation_id"}';
    }
    location @too_large {
        default_type application/json;
        add_header X-Request-ID $correlation_id always;
        return 413 '{"detail":"Request body is too large","code":"request_too_large","correlation_id":"$correlation_id"}';
    }

    # React Router (BrowserRouter) cần fallback về index.html cho mọi route
    # (/login, /register, /) - nếu không, refresh trang /login sẽ ra 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
