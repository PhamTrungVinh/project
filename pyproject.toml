[project]
name = "fpt-customer-chatbot-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "pydantic[email]>=2.0",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langchain-huggingface>=0.1",
    "groq>=0.9",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-tavily>=0.1",
    "langchain-community>=0.3",
    "langchain-experimental>=0.3",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "pypdf>=4.0",
    "rank-bm25>=0.2",
    "cachetools>=5.3",
    "numexpr>=2.10",
    "python-dateutil>=2.9",
    "pytest>=8.0",
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "crud",
    "graph",
    "memory",
    "models",
    "rag",
    "routers",
    "schemas",
    "services",
    "tools",
    "utils",
]