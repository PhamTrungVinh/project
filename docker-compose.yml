x-service: &service
  build: .
  image: fpt-support-local:latest
  restart: unless-stopped

x-common-env: &common-env
  APP_ENV: development
  GROQ_API: ${GROQ_API:?GROQ_API is required}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres17_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  business-backend:
    <<: *service
    command: sh -c "./.venv/bin/python -m scripts.migrate_service identity && ./.venv/bin/python -m scripts.migrate_service ticket && ./.venv/bin/python -m scripts.migrate_service booking && ./.venv/bin/python -m scripts.migrate_service event && exec ./.venv/bin/uvicorn business_backend.app:app --host 0.0.0.0 --port 8000 --forwarded-allow-ips=\"*\""
    environment:
      <<: *common-env
      IDENTITY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/identity
      TICKET_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/ticket
      BOOKING_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/booking
      EVENT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/event
      OUTBOX_WORKER_ENABLED: "true"
      OUTBOX_POLL_SECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  chat-orchestrator:
    <<: *service
    command: sh -c "./.venv/bin/python -m scripts.migrate_service chat && ./.venv/bin/python -m scripts.migrate_service memory && exec ./.venv/bin/uvicorn chat_orchestrator.app:app --host 0.0.0.0 --port 8005 --forwarded-allow-ips=\"*\""
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/chat
      CHAT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/chat
      CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/checkpoints
      MEMORY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/memory
      REDIS_URL: redis://redis:6379/0
      PDF_PATH: /app/FSoft_HR.pdf
      FAISS_INDEX_PATH: /app/faiss_index
      RAG_ARTIFACT_URI: ${RAG_ARTIFACT_URI:-}
      RAG_ARTIFACT_VERSION: ${RAG_ARTIFACT_VERSION:-}
      TICKET_ADAPTER: http
      BOOKING_ADAPTER: http
      MEMORY_ADAPTER: local
      KNOWLEDGE_ADAPTER: local
      TICKET_SERVICE_URL: http://business-backend:8000
      BOOKING_SERVICE_URL: http://business-backend:8000
      HITL_ENABLED: ${HITL_ENABLED:-true}
    volumes:
      - ./FSoft_HR.pdf:/app/FSoft_HR.pdf:ro
      - faiss_data:/app/faiss_index
      - hf_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      business-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
        VITE_CHAT_API_BASE: /api
    ports:
      - "5173:80"
    depends_on:
      business-backend:
        condition: service_healthy
      chat-orchestrator:
        condition: service_healthy

volumes:
  postgres17_data:
  faiss_data:
  hf_cache:
